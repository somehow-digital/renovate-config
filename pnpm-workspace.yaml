allowBuilds:
  better-sqlite3: true
  core-js-pure: true
  dtrace-provider: true
  protobufjs: true
  re2: true
blockExoticSubdeps: true
enablePrePostScripts: false
optimisticRepeatInstall: true
shellEmulator: true
trustPolicy: no-downgrade
overrides:
